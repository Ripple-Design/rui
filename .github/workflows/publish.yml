name: Build and Publish

on:
    workflow_dispatch:
        inputs:
            package:
                description: Package to publish
                required: true
                default: rui
                type: choice
                options:
                    - rui
                    - rux-video-player
                    - rux-data-table
                    - rux-chat
                    - rux-date-time-picker
                    - rux-font-picker
    push:
        tags:
            - "v*"
            - "rux-video-player-v*"
            - "rux-data-table-v*"
            - "rux-chat-v*"
            - "rux-date-time-picker-v*"
            - "rux-font-picker-v*"

jobs:
    publish:
        name: Build & Publish to npm
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v3
              with:
                  version: 10.2.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "pnpm"
                  registry-url: "https://registry.npmjs.org"
                  scope: "@ripple-design"

            - name: Upgrade npm
              run: npm install -g npm@latest

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Resolve Package
              id: package
              shell: bash
              env:
                  SELECTED_PACKAGE: ${{ inputs.package }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  package="${SELECTED_PACKAGE:-rui}"
                  if [[ "$REF_NAME" == rux-video-player-v* ]]; then
                      package="rux-video-player"
                  elif [[ "$REF_NAME" == rux-data-table-v* ]]; then
                      package="rux-data-table"
                  elif [[ "$REF_NAME" == rux-chat-v* ]]; then
                      package="rux-chat"
                  elif [[ "$REF_NAME" == rux-date-time-picker-v* ]]; then
                      package="rux-date-time-picker"
                  elif [[ "$REF_NAME" == rux-font-picker-v* ]]; then
                      package="rux-font-picker"
                  fi
                  echo "name=$package" >> "$GITHUB_OUTPUT"
                  echo "directory=packages/$package" >> "$GITHUB_OUTPUT"

            - name: Build Library
              run: pnpm --filter ${{ steps.package.outputs.name }} build

            - name: Publish to npm
              working-directory: ${{ steps.package.outputs.directory }}
              run: npm publish --provenance
